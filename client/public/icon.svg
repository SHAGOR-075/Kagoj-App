<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1e22" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EFE9DF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="foldShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#ambientGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- Stacked back paper (subtle depth) -->
  <path d="M152 148h188l68 68v180a22 22 0 0 1-22 22H152a22 22 0 0 1-22-22V170a22 22 0 0 1 22-22z" fill="#D6CDC0" opacity="0.4" transform="rotate(-3 256 256)" />

  <!-- Main tactile paper sheet with drop shadow -->
  <g filter="url(#shadow)">
    <path d="M136 120h176l76 76v196a22 22 0 0 1-22 22H136a22 22 0 0 1-22-22V142a22 22 0 0 1 22-22z" fill="url(#paperGrad)" />
  </g>

  <!-- Folded corner with depth -->
  <path d="M312 120v64a12 12 0 0 0 12 12h64" fill="#E2DACD" filter="url(#foldShadow)" />
  <path d="M312 120v64a12 12 0 0 0 12 12h64" fill="none" stroke="#D1C6B4" stroke-width="2" />

  <!-- Bengali letter "ক" watermark / subtle brand mark -->
  <text x="246" y="278" font-family="'Hind Siliguri', 'Source Serif 4', serif" font-size="96" font-weight="700" fill="#292524" fill-opacity="0.07" text-anchor="middle">ক</text>

  <!-- Minimalist notepad lines -->
  <line x1="168" y1="230" x2="310" y2="230" stroke="#DDD4C5" stroke-width="6" stroke-linecap="round" />
  <line x1="168" y1="272" x2="336" y2="272" stroke="#DDD4C5" stroke-width="6" stroke-linecap="round" />
  <line x1="168" y1="314" x2="336" y2="314" stroke="#DDD4C5" stroke-width="6" stroke-linecap="round" />
  <line x1="168" y1="356" x2="256" y2="356" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Polished Gold / Amber Fountain Pen Nib Accent -->
  <g transform="translate(320, 310) rotate(-45)">
    <!-- Nib Body -->
    <path d="M0 0 L18 28 L14 74 L-14 74 L-18 28 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
    <!-- Nib Breather Hole & Slit -->
    <circle cx="0" cy="38" r="3.5" fill="#1f1e22" />
    <line x1="0" y1="0" x2="0" y2="34.5" stroke="#1f1e22" stroke-width="2" stroke-linecap="round" />
    <!-- Nib Tip Highlight -->
    <polygon points="0,0 4,14 -4,14" fill="#FDE68A" />
  </g>
</svg>
